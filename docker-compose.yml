services:
  mechanicshop.api:
    build:
      context: .
      dockerfile: src/MechanicShop.Api/Dockerfile
      target: final
    ports:
      - "5001:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=MechanicShopDb;User=sa;Password=YourStrong@Password1;TrustServerCertificate=True;MultipleActiveResultSets=True
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      AppSettings__ClientBaseUrl: http://localhost:5001
      Smtp__Host: smtp4dev
      Smtp__Port: 25
      Smtp__Security: None
    depends_on:
      - sqlserver
      - seq
      - smtp4dev
    restart: on-failure

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong@Password1
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: always

  seq:
    image: datalust/seq:latest
    volumes:
      - ./containers/seq:/data
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    restart: unless-stopped

  # Dev-only fake mail server: catches every email the API sends. Web UI on http://localhost:5080
  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "5080:80"
      - "2525:25"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./containers/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - mechanicshop.api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: YourStrongPwd
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  sqlserver-data:
  grafana-data:
